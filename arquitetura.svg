<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232c47"/><stop offset="1" stop-color="#161d33"/>
    </linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="960" height="560" fill="url(#ceu)" rx="16"/>

  <!-- estrelas -->
  <g fill="#e2e8f0">
    <circle cx="60" cy="60" r="1.4"/><circle cx="140" cy="110" r="1"/><circle cx="240" cy="45" r="1.6"/>
    <circle cx="420" cy="75" r="1.1"/><circle cx="610" cy="50" r="1.4"/><circle cx="760" cy="95" r="1"/>
    <circle cx="880" cy="60" r="1.6"/><circle cx="915" cy="180" r="1.1"/><circle cx="60" cy="330" r="1.2"/>
    <circle cx="45" cy="480" r="1.5"/><circle cx="330" cy="520" r="1"/><circle cx="640" cy="530" r="1.3"/>
    <circle cx="890" cy="470" r="1.2"/><circle cx="510" cy="120" r="0.9"/><circle cx="820" cy="300" r="1"/>
  </g>
  <!-- planeta decorativo -->
  <circle cx="895" cy="120" r="26" fill="#7c3aed" opacity="0.85"/>
  <ellipse cx="895" cy="120" rx="42" ry="9" fill="none" stroke="#c4b5fd" stroke-width="2.5" opacity="0.8" transform="rotate(-18 895 120)"/>

  <text x="48" y="62" fill="#f8fafc" font-size="27" font-weight="bold" filter="url(#glow)">Corretor Cósmico 🪐</text>
  <text x="48" y="88" fill="#94a3b8" font-size="14">Agente autônomo · Weekend Agent Challenge · 100% AWS Free Tier · região us-east-1</text>

  <!-- ETAPA 1: Scheduler -->
  <g>
    <rect x="48" y="140" width="200" height="104" rx="14" fill="url(#cardA)" stroke="#f472b6" stroke-width="2"/>
    <circle cx="70" cy="162" r="13" fill="#f472b6"/><text x="70" y="167" text-anchor="middle" fill="#0b1026" font-size="13" font-weight="bold">1</text>
    <text x="92" y="167" fill="#f8fafc" font-size="15" font-weight="bold">EventBridge</text>
    <text x="92" y="185" fill="#f8fafc" font-size="15" font-weight="bold">Scheduler</text>
    <text x="66" y="212" fill="#94a3b8" font-size="12">cron(0 8 * * ? *)</text>
    <text x="66" y="229" fill="#94a3b8" font-size="12">fuso America/Sao_Paulo</text>
  </g>

  <!-- ETAPA 2: Lambda -->
  <g>
    <rect x="330" y="140" width="220" height="104" rx="14" fill="url(#cardA)" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="352" cy="162" r="13" fill="#fbbf24"/><text x="352" y="167" text-anchor="middle" fill="#0b1026" font-size="13" font-weight="bold">2</text>
    <text x="374" y="168" fill="#f8fafc" font-size="15" font-weight="bold">AWS Lambda</text>
    <text x="348" y="194" fill="#94a3b8" font-size="12">Python 3.12 · o cérebro</text>
    <text x="348" y="211" fill="#94a3b8" font-size="12">orquestra, calcula e audita</text>
    <text x="348" y="228" fill="#94a3b8" font-size="12">todos os números</text>
  </g>

  <!-- NASA -->
  <g>
    <rect x="640" y="120" width="272" height="88" rx="14" fill="url(#cardA)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="662" y="150" fill="#f8fafc" font-size="15" font-weight="bold">🔭 NASA Exoplanet Archive</text>
    <text x="662" y="172" fill="#94a3b8" font-size="12">API pública TAP · consulta ADQL</text>
    <text x="662" y="189" fill="#94a3b8" font-size="12">~5.000 planetas confirmados · sem chave</text>
  </g>

  <!-- Bedrock -->
  <g>
    <rect x="640" y="240" width="272" height="88" rx="14" fill="url(#cardA)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="662" cy="262" r="13" fill="#a78bfa"/><text x="662" y="267" text-anchor="middle" fill="#0b1026" font-size="13" font-weight="bold">3</text>
    <text x="684" y="268" fill="#f8fafc" font-size="15" font-weight="bold">Amazon Bedrock · Nova Lite</text>
    <text x="662" y="294" fill="#94a3b8" font-size="12">API Converse · persona do corretor</text>
    <text x="662" y="311" fill="#94a3b8" font-size="12">criatividade na prosa, nunca nos números</text>
  </g>

  <!-- DynamoDB -->
  <g>
    <rect x="330" y="330" width="220" height="88" rx="14" fill="url(#cardA)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="352" cy="352" r="13" fill="#22d3ee"/><text x="352" y="357" text-anchor="middle" fill="#0b1026" font-size="13" font-weight="bold">4</text>
    <text x="374" y="358" fill="#f8fafc" font-size="15" font-weight="bold">DynamoDB</text>
    <text x="348" y="384" fill="#94a3b8" font-size="12">a memória do agente:</text>
    <text x="348" y="401" fill="#94a3b8" font-size="12">nunca anuncia o mesmo mundo 2×</text>
  </g>

  <!-- SES -->
  <g>
    <rect x="640" y="360" width="272" height="88" rx="14" fill="url(#cardA)" stroke="#34d399" stroke-width="2"/>
    <circle cx="662" cy="382" r="13" fill="#34d399"/><text x="662" y="387" text-anchor="middle" fill="#0b1026" font-size="13" font-weight="bold">5</text>
    <text x="684" y="388" fill="#f8fafc" font-size="15" font-weight="bold">Amazon SES</text>
    <text x="662" y="414" fill="#94a3b8" font-size="12">e-mail HTML + texto (acessível)</text>
    <text x="662" y="431" fill="#94a3b8" font-size="12">"🪐 Imóvel do dia" na caixa de entrada</text>
  </g>

  <!-- fluxos -->
  <path d="M248,192 L322,192" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="285" y="182" text-anchor="middle" fill="#7dd3fc" font-size="11">acorda</text>

  <path d="M550,168 C595,160 605,158 632,160" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="592" y="146" text-anchor="middle" fill="#7dd3fc" font-size="11">sorteia um mundo</text>

  <path d="M550,216 C595,230 605,255 632,270" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="577" y="252" text-anchor="middle" fill="#7dd3fc" font-size="11">fatos em JSON</text>

  <path d="M440,244 L440,322" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="475" y="288" text-anchor="middle" fill="#7dd3fc" font-size="11">já anunciei?</text>

  <path d="M550,388 C580,394 600,398 632,402" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="590" y="382" text-anchor="middle" fill="#7dd3fc" font-size="11">entrega o anúncio</text>

  <text x="480" y="520" text-anchor="middle" fill="#818cf8" font-size="14" font-style="italic" filter="url(#glow)">Nenhum botão foi clicado na produção deste e-mail.</text>
</svg>
